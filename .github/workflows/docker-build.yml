name: Publish Docker image (Multi-arch)

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., v0.10.8-alpha.3)'
        required: true
        type: string

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag & write VERSION
        id: version
        env:
          # Do not interpolate workflow_dispatch input directly into shell
          # source.  A tag/ref is user-controlled input and must be treated as
          # data until it has passed the Docker tag validation below.
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${INPUT_TAG:-}"
          if [ -n "$TAG" ]; then
            # The value is used as a Docker tag suffix and written to
            # GITHUB_ENV/GITHUB_OUTPUT.  Reject newlines, shell metacharacters,
            # and values Docker would reject rather than relying on quoting.
            if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Tag '$TAG' is not a valid Docker tag"
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
              echo "::error::Tag '$TAG' does not exist"
              exit 1
            fi
          else
            case "$GITHUB_REF" in
              refs/tags/*)
                TAG="${GITHUB_REF#refs/tags/}"
                ;;
              *)
                echo "::error::This workflow must run for a tag ref"
                exit 1
                ;;
            esac
            if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::Tag '$TAG' is not a valid Docker tag"
              exit 1
            fi
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "${TAG}" > VERSION
          echo "Building tag: ${TAG} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: calciumion/new-api

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            calciumion/new-api:${{ env.TAG }}-${{ matrix.arch }}
            calciumion/new-api:latest-${{ matrix.arch }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_VERSION=${{ env.TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes calciumion/new-api@${{ steps.build.outputs.digest }}

      - name: Image summary
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "calciumion/new-api:${TAG}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Record immutable build metadata
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: calciumion/new-api:${{ env.TAG }}-${{ matrix.arch }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p build-metadata
          {
            printf 'image=%s\n' "$IMAGE_TAG"
            printf 'digest=%s\n' "$IMAGE_DIGEST"
            printf 'source_commit=%s\n' "$SOURCE_COMMIT"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'architecture=%s\n' "${{ matrix.arch }}"
          } > "build-metadata/${{ matrix.arch }}.txt"

      - name: Upload immutable build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-build-metadata-${{ matrix.arch }}-${{ github.run_id }}
          path: build-metadata/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 90

  create_manifests:
    name: Create multi-arch manifests
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Set version
        run: echo "TAG=${{ needs.build_single_arch.outputs.tag }}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifests
        id: manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t calciumion/new-api:${TAG} \
            -t calciumion/new-api:latest \
            calciumion/new-api:${TAG}-amd64 \
            calciumion/new-api:${TAG}-arm64

          image="calciumion/new-api:${TAG}"
          digest="$(docker buildx imagetools inspect "$image" | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ ! "$digest" =~ ^sha256:[[:xdigit:]]{64}$ ]]; then
            echo "::error::Unable to resolve an immutable digest for $image"
            exit 1
          fi
          latest_digest="$(docker buildx imagetools inspect calciumion/new-api:latest | awk '$1 == "Digest:" {print $2; exit}')"
          if [[ "$latest_digest" != "$digest" ]]; then
            echo "::error::Version and latest tags resolved to different manifest digests"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "$image" "$digest" > manifest-digests.txt
          printf '%s@%s\n' calciumion/new-api:latest "$digest" >> manifest-digests.txt

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.51.1

      - name: Generate SPDX SBOMs for final manifest platforms
        run: |
          set -euo pipefail
          image="registry:index.docker.io/calciumion/new-api@${{ steps.manifest.outputs.digest }}"
          "${{ steps.syft.outputs.cmd }}" scan --platform linux/amd64 \
            --source-name 'index.docker.io/calciumion/new-api#linux/amd64' \
            --output spdx-json=sbom-amd64.spdx.json "$image"
          "${{ steps.syft.outputs.cmd }}" scan --platform linux/arm64 \
            --source-name 'index.docker.io/calciumion/new-api#linux/arm64' \
            --output spdx-json=sbom-arm64.spdx.json "$image"

      - name: Attest final manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        with:
          subject-name: index.docker.io/calciumion/new-api
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest final manifest SBOM (amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        with:
          subject-name: index.docker.io/calciumion/new-api
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest final manifest SBOM (arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        with:
          subject-name: index.docker.io/calciumion/new-api
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign manifests with cosign (immutable digests)
        run: |
          set -euo pipefail
          cosign sign --yes "index.docker.io/calciumion/new-api@${{ steps.manifest.outputs.digest }}"

      - name: Manifest summary
        run: |
          echo "### Multi-arch Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect calciumion/new-api:${TAG} >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect calciumion/new-api:latest >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload immutable manifest record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-manifest-digests-${{ needs.build_single_arch.outputs.tag }}
          path: manifest-digests.txt
          if-no-files-found: error
          retention-days: 90
