name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, test, and race
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Validate hardened Compose policy
        env:
          NEW_API_IMAGE: calciumion/new-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          NEWAPI_REDIS_IMAGE: redis:7-alpine@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          NEWAPI_POSTGRES_IMAGE: postgres:15-alpine@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        run: |
          set -euo pipefail
          secret_dir="$(mktemp -d)"
          trap 'rm -rf "$secret_dir"' EXIT
          chmod 700 "$secret_dir"
          for name in session_secret crypto_secret sql_dsn redis_conn_string redis_password postgres_password; do
            printf 'ci-placeholder\n' > "$secret_dir/$name"
            chmod 600 "$secret_dir/$name"
          done
          NEWAPI_SECRET_DIR="$secret_dir" bash scripts/verify-secure-compose.sh
          NEWAPI_SECRET_DIR="$secret_dir" docker compose -f docker-compose.secure.yml config --quiet

      - name: Test Docker attestation contracts
        run: bash scripts/test-docker-attestations.sh

      - name: Test root and relaykit modules
        run: make test

      - name: Race-test stateful backend packages
        run: go test -race ./common ./model ./service ./controller ./relay ./router ./middleware -count=1

  frontend:
    name: Frontend audit, static checks, test, and build
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --json

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check unused code and dependencies
        run: bun run knip

      - name: Test
        run: bun run test

      - name: Build and enforce bundle budget
        run: bun run build
