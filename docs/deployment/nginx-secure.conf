# Example edge policy for a production NewAPI deployment.
# Replace example.com, certificate paths, and the monitoring allow-list before
# enabling. The application should remain bound to 127.0.0.1 by Compose.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Never serve the default Nginx site or disclose which virtual host is active.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # These endpoints expose deployment/bootstrap metadata and are not part of
    # the public API surface. Permit only the local reverse proxy and explicit
    # monitoring addresses; remove the sample address when not needed.
    location = /api/setup {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }
    location = /api/status {
        allow 127.0.0.1;
        allow ::1;
        allow 192.0.2.10; # replace with the monitoring collector address
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        client_max_body_size 16m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Rebuild, rather than append to, forwarding headers at the trusted
        # edge. NewAPI's TRUSTED_PROXIES must contain this proxy's address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:3000;
    }
}
